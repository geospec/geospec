<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="icon" type="image/png" href="/assets/geospec-logo.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..700&display=swap"
      rel="stylesheet"
    />

    <title>GeoSpec Solutions | Geospatial Intelligence</title>
    <meta
      name="description"
      content="GeoSpec Solutions delivers advanced geospatial intelligence, satellite analytics and spatial data services to organisations across Africa."
    />
    <script>
      // Apply the saved theme before first paint to avoid a light flash.
      try {
        if (localStorage.getItem('geospec-theme') === 'dark') {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
